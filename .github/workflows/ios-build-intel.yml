name: iOS Build Intel

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          if [ -d /Applications/Xcode_26.3.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.3.app
          else
            sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          fi
          xcodebuild -version
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi
          xcodegen --version

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Archive (unsigned)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project KugouLite.xcodeproj \
            -scheme KugouLite \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/KugouLite.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee build.log

      - name: Package unsigned IPA
        run: |
          APP=$(find build/KugouLite.xcarchive/Products/Applications -maxdepth 1 -name "*.app" | head -1)
          echo "app: $APP"
          test -n "$APP"
          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          cd out
          zip -qry ../KugouLite-iOS15-unsigned.ipa Payload
          cd ..
          ls -lh KugouLite-iOS15-unsigned.ipa

      - name: Summary
        if: always()
        run: |
          echo "=== errors ==="
          grep "error:" build.log | sort -u | head -100 || true
          echo "=== result ==="
          grep -E "ARCHIVE (SUCCEEDED|FAILED)" build.log | tail -2 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: unsigned-ipa
          path: KugouLite-iOS15-unsigned.ipa

      - name: Publish IPA to release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.142
          name: Sonora 1.0.142
          body: |
            Sonora 1.0.142 unsigned IPA
            - 修复歌词页切回播放页时约 0.5 秒专辑封面空白：CoverImage 建视图时同步命中缓存，播放页在歌词页打开后常驻，不再销毁重建
            - CrossfadeArtwork 支持父视图已解码封面兜底，封面切换失败时也不会露出占位图
            - 歌词页与播放页改为同层交叉淡入，封面、标题、进度条全部连续；连续开关会带着上一段动画速度继续走
            - 首页三个 tab 改为常驻交叉淡入 + 极小缩放/位移，切换不再瞬切
            - 第一首歌开始播放时迷你播放卡从底栏滑入，底栏高度弹簧过渡
            - 全局弹簧补 blendDuration，连续点击/连续切页时不会从零速度重新起步
            - 开启 CADisableMinimumFrameDurationOnPhone，过渡动画按显示刷新率出帧
          files: KugouLite-iOS15-unsigned.ipa
