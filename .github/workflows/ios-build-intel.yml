name: iOS Build Intel

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          if [ -d /Applications/Xcode_26.3.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.3.app
          else
            sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          fi
          xcodebuild -version
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi
          xcodegen --version

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Archive (unsigned)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project KugouLite.xcodeproj \
            -scheme KugouLite \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/KugouLite.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee build.log

      - name: Package unsigned IPA
        run: |
          APP=$(find build/KugouLite.xcarchive/Products/Applications -maxdepth 1 -name "*.app" | head -1)
          echo "app: $APP"
          test -n "$APP"
          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          cd out
          zip -qry ../KugouLite-iOS15-unsigned.ipa Payload
          cd ..
          ls -lh KugouLite-iOS15-unsigned.ipa

      - name: Summary
        if: always()
        run: |
          echo "=== errors ==="
          grep "error:" build.log | sort -u | head -100 || true
          echo "=== result ==="
          grep -E "ARCHIVE (SUCCEEDED|FAILED)" build.log | tail -2 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: unsigned-ipa
          path: KugouLite-iOS15-unsigned.ipa

      - name: Publish IPA to release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.147
          name: Sonora 1.0.147
          body: |
            Sonora 1.0.147 unsigned IPA
            - 球位置断开改为几何分段，不再依赖 destinationOut 擦除；轨道线、已播放线、高潮高亮都在球心左右各 1pt 直接不画
            - 球位置形成真实的 2pt 背景缺口，线段用 butt cap 收口，不会被圆头重新接上
            - 保留 v146 的高潮高亮修复：不再先画本地猜测位置，只认官方 climax 数据
            - 保留 v143 的进度条卡死修复与 v142 的整体过渡优化
          files: KugouLite-iOS15-unsigned.ipa
