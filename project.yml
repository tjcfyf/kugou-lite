name: KugouLite
options:
  bundleIdPrefix: com.tjcfyf
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
schemes:
  KugouLite:
    build:
      targets:
        KugouLite: all
    run:
      config: Release
    archive:
      config: Release
targets:
  KugouLite:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources/mdx-voc-ft.tflite
        buildPhase: resources
      - path: Vendor/TencentOpenApi_IOS_Bundle.bundle
        buildPhase: resources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Sonora
        CFBundleShortVersionString: "1.0.128"
        CFBundleVersion: "128"
        UILaunchScreen: {}
        UIBackgroundModes:
          - audio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        LSApplicationQueriesSchemes:
          - mqq
          - mqqapi
          - mqqopensdkapi
          - mqqopensdkapiV2
          - mqqopensdkapiV3
          - mqqopensdkfriend
          - mqqopensdkssologin
          - mqqopensdknopasteboard
          - mqqconnect
          - mqqbrowser
          - mttbrowser
          - mqzone
          - mqzoneopensdk
          - mqzoneopensdkapi
          - mqzoneopensdkapiV2
          - mqzoneopensdkapi19
          - mqzoneopensdkapiV3
          - wtloginmqq
          - wtloginmqq2
          - mqqwpa
        CFBundleURLTypes:
          - CFBundleURLName: tencent101706348
            CFBundleURLSchemes:
              - tencent101706348
          - CFBundleURLName: tencent205141
            CFBundleURLSchemes:
              - tencent205141
    dependencies:
      - framework: Vendor/TencentOpenAPI.framework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tjcfyf.kugoulite
        PRODUCT_NAME: KugouLite
        TARGETED_DEVICE_FAMILY: "1,2"
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/Vendor"
        OTHER_LDFLAGS: "$(inherited) -framework TensorFlowLiteC -lc++ -framework SystemConfiguration -framework TencentOpenAPI -ObjC -lz -lsqlite3 -liconv"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Sonora-Bridging-Header.h
        CODE_SIGN_IDENTITY: ""
