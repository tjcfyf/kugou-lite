name: iOS Build Intel

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          if [ -d /Applications/Xcode_26.3.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.3.app
          else
            sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          fi
          xcodebuild -version
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi
          xcodegen --version

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Archive (unsigned)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project KugouLite.xcodeproj \
            -scheme KugouLite \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/KugouLite.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee build.log

      - name: Package unsigned IPA
        run: |
          APP=$(find build/KugouLite.xcarchive/Products/Applications -maxdepth 1 -name "*.app" | head -1)
          echo "app: $APP"
          test -n "$APP"
          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          cd out
          zip -qry ../KugouLite-iOS15-unsigned.ipa Payload
          cd ..
          ls -lh KugouLite-iOS15-unsigned.ipa

      - name: Summary
        if: always()
        run: |
          echo "=== errors ==="
          grep "error:" build.log | sort -u | head -100 || true
          echo "=== result ==="
          grep -E "ARCHIVE (SUCCEEDED|FAILED)" build.log | tail -2 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: unsigned-ipa
          path: KugouLite-iOS15-unsigned.ipa

      - name: Publish IPA to release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.153
          name: Sonora 1.0.153
          body: |
            Sonora 1.0.153 unsigned IPA

            资料库按 Apple Music 新版结构：最近添加专辑网格、歌曲/最近播放列表、我的歌单；搜索热门分类彩色磁贴；专辑/歌手/歌单/排行榜详情统一全幅头图、玻璃关闭钮与播放/随机按钮；资料库歌曲与队列改为无卡片列表。
            - 资料库改为最新 Apple Music 结构：最近添加专辑双列网格、歌曲/最近播放玻璃列表、我的歌单；移除旧的彩色快捷卡
            - 搜索热门搜索改为双列彩色分类磁贴，最近搜索/搜索结果标题升级为 Apple Music 大标题层级
            - 专辑/歌手/歌单/排行榜/导入歌单详情统一：全幅模糊头图、左对齐大标题、红色播放胶囊、玻璃随机按钮与磨砂关闭钮
            - 资料库歌曲、播放队列改为无卡片纯列表，去除旧 insetGrouped 灰底
            - 设置/睡眠定时/均衡器/导入/登录等卡片统一 20–22pt 玻璃圆角
            - 底栏为浮动液态玻璃胶囊：首页/资料库 + 独立搜索圆钮，向下滚动自动收起为纯图标，回到顶部展开
            - 迷你播放器为浮在底栏上方的玻璃胶囊，支持左右轻扫切歌
            - 首页大尺寸精选封面卡（第一张 292pt，其余 186pt）+ 最近播放横向卡片，iOS 26 大标题间距
            - 播放页保留 2pt 细进度条、透明 2pt 断口球、官方高潮高亮、当前歌词清晰其余模糊与全屏封面过渡
            - 播放页封面圆角、阴影和顶栏玻璃圆钮同步更新
            - 保留 v150 真实顶栏模糊与歌词非当前句模糊
