name: iOS Build Intel

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          if [ -d /Applications/Xcode_26.3.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.3.app
          else
            sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          fi
          xcodebuild -version
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi
          xcodegen --version

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Archive (unsigned)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project KugouLite.xcodeproj \
            -scheme KugouLite \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/KugouLite.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee build.log

      - name: Package unsigned IPA
        run: |
          APP=$(find build/KugouLite.xcarchive/Products/Applications -maxdepth 1 -name "*.app" | head -1)
          echo "app: $APP"
          test -n "$APP"
          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          cd out
          zip -qry ../KugouLite-iOS15-unsigned.ipa Payload
          cd ..
          ls -lh KugouLite-iOS15-unsigned.ipa

      - name: Summary
        if: always()
        run: |
          echo "=== errors ==="
          grep "error:" build.log | sort -u | head -100 || true
          echo "=== result ==="
          grep -E "ARCHIVE (SUCCEEDED|FAILED)" build.log | tail -2 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: unsigned-ipa
          path: KugouLite-iOS15-unsigned.ipa

      - name: Publish IPA to release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.157
          name: Sonora 1.0.157
          body: |
            Sonora 1.0.157 unsigned IPA

            按 emilkowalski/skills 的 apple-design / animation-performance / choreograph /
            review-animations 规范，完成 iOS 27.2 Apple Music 黑白版的全站视觉与动效重做。
            参考 2026 年 10 月 Apple Music 去红色品牌更新：纯白/纯黑纸面、系统蓝选中态、
            固定玻璃 tab bar、无卡片资料库、全幅歌手页与播放器底栏 AirPlay/队列。
            - 主题去红色：全站 accent 改为 dynamic system blue；背景纯白/纯黑
            - 底栏改为单条三 tab 玻璃栏，选中玻璃片 matchedGeometryEffect；不再随滚动变形
            - 移除滚动 offset preference：列表滚动不再每帧向 ChromeState 推送
            - 首页重做 Top Picks 竖版大卡、最近播放方形卡、无卡片榜单与每日推荐
            - 资料库改为最近添加四宫格 + 播放列表/专辑/歌曲/最近播放/已导入索引行
            - 歌手页改为全幅头图、居中白色播放键、最新发行、热门歌曲 TOP5、代表专辑
            - 专辑页改为大封面头图、无重复封面曲目列表、播放/随机/下一首播放
            - 搜索页改为系统材质搜索框、最近搜索列表、中性热门搜索卡
            - 播放页去掉顶部抓手，底栏统一为歌词/AirPlay/队列，评论与伴唱收进更多菜单
            - 设置页改为 iOS 分组列表：13pt 分组标题、浅灰 12pt 圆角组、无阴影
            - 全面按压反馈改为 120ms ease-out opacity/scale，弹簧全部临界阻尼
            - 进度条、透明 2pt 断口球、当前歌词清晰其余模糊、真实渐变顶栏模糊保持不变
