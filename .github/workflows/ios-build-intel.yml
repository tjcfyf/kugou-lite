name: iOS Build Intel

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          if [ -d /Applications/Xcode_26.3.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.3.app
          else
            sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          fi
          xcodebuild -version
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi
          xcodegen --version

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Archive (unsigned)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project KugouLite.xcodeproj \
            -scheme KugouLite \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/KugouLite.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee build.log

      - name: Package unsigned IPA
        run: |
          APP=$(find build/KugouLite.xcarchive/Products/Applications -maxdepth 1 -name "*.app" | head -1)
          echo "app: $APP"
          test -n "$APP"
          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          cd out
          zip -qry ../KugouLite-iOS15-unsigned.ipa Payload
          cd ..
          ls -lh KugouLite-iOS15-unsigned.ipa

      - name: Summary
        if: always()
        run: |
          echo "=== errors ==="
          grep "error:" build.log | sort -u | head -100 || true
          echo "=== result ==="
          grep -E "ARCHIVE (SUCCEEDED|FAILED)" build.log | tail -2 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: unsigned-ipa
          path: KugouLite-iOS15-unsigned.ipa

      - name: Publish IPA to release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.152
          name: Sonora 1.0.152
          body: |
            Sonora 1.0.152 unsigned IPA
            - 按 iOS 26 Apple Music 液态玻璃重做整体视觉：Apple Music 红强调色、纯黑/暖白背景、玻璃卡片与高光描边
            - 底栏改为浮动液态玻璃胶囊：首页/资料库 + 独立搜索圆钮，向下滚动自动收起为纯图标，回到顶部展开
            - 迷你播放器改为浮在底栏上方的玻璃胶囊，支持左右轻扫切歌
            - 首页改为大尺寸精选封面卡（第一张 292pt，其余 186pt）+ 最近播放横向卡片，标题改为 iOS 26 大标题间距
            - 资料库新增最近播放/我喜欢快捷玻璃卡、最近添加专辑双列网格
            - 搜索框改为胶囊磨砂玻璃，搜索页卡片圆角与标题层级统一
            - 播放页封面圆角、阴影和顶栏玻璃圆钮同步更新
            - 保留 v150 真实顶栏模糊与歌词非当前句模糊
