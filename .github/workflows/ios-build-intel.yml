name: iOS Build Intel

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          if [ -d /Applications/Xcode_26.3.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.3.app
          else
            sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          fi
          xcodebuild -version
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi
          xcodegen --version

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Archive (unsigned)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project KugouLite.xcodeproj \
            -scheme KugouLite \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/KugouLite.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee build.log

      - name: Package unsigned IPA
        run: |
          APP=$(find build/KugouLite.xcarchive/Products/Applications -maxdepth 1 -name "*.app" | head -1)
          echo "app: $APP"
          test -n "$APP"
          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          cd out
          zip -qry ../KugouLite-iOS15-unsigned.ipa Payload
          cd ..
          ls -lh KugouLite-iOS15-unsigned.ipa

      - name: Summary
        if: always()
        run: |
          echo "=== errors ==="
          grep "error:" build.log | sort -u | head -100 || true
          echo "=== result ==="
          grep -E "ARCHIVE (SUCCEEDED|FAILED)" build.log | tail -2 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: unsigned-ipa
          path: KugouLite-iOS15-unsigned.ipa

      - name: Publish IPA to release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.154
          name: Sonora 1.0.154
          body: |
            Sonora 1.0.154 unsigned IPA

            资料库按 Apple Music 新版结构：最近添加专辑网格、歌曲/最近播放列表、我的歌单；搜索热门分类彩色磁贴；专辑/歌手/歌单/排行榜详情统一全幅头图、玻璃关闭钮与播放/随机按钮；资料库歌曲与队列改为无卡片列表。
            - 全量 UI 规范：主页每日推荐改为玻璃列表卡，资料库播放列表标题/60pt 封面/17pt 行文字全部重做
            - 播放队列按 Apple Music “正在播放/接下来”重做：52pt 封面、时长、当前曲目红色指示、玻璃关闭钮、编辑/随机/清空菜单
            - 资料库歌曲页改为大标题 + 播放/随机胶囊 + 无卡片纯列表，支持排序与清空菜单
            - 歌曲行统一为 52pt 圆角封面、16pt 歌名、13pt 歌手、右侧时长，移除每行爱心；按压改为 Apple Music 式底色高亮而不是整行缩放
            - 专辑/歌手详情改为全屏 cover 进入，顶部磨砂关闭钮，曲目行加入分隔线与序号
            - 歌单/排行榜/导入歌单详情统一全幅头图、左对齐标题、红色播放胶囊、玻璃随机/关闭钮
            - 主页右上角新增账号入口；tab 切换改为 0.17s 短交叉淡入；浮动底栏选中态加入滑动的玻璃胶囊
            - 评论/回复/设置/导入页统一大标题、磨砂关闭钮与玻璃卡片
            - 底栏为浮动液态玻璃胶囊：首页/资料库 + 独立搜索圆钮，向下滚动自动收起为纯图标，回到顶部展开
            - 迷你播放器为浮在底栏上方的玻璃胶囊，支持左右轻扫切歌
            - 首页大尺寸精选封面卡（第一张 292pt，其余 186pt）+ 最近播放横向卡片，iOS 26 大标题间距
            - 播放页保留 2pt 细进度条、透明 2pt 断口球、官方高潮高亮、当前歌词清晰其余模糊与全屏封面过渡
            - 播放页封面圆角、阴影和顶栏玻璃圆钮同步更新
            - 保留 v150 真实顶栏模糊与歌词非当前句模糊
