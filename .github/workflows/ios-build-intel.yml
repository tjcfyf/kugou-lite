name: iOS Build Intel

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          if [ -d /Applications/Xcode_26.3.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.3.app
          else
            sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          fi
          xcodebuild -version
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi
          xcodegen --version

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Archive (unsigned)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project KugouLite.xcodeproj \
            -scheme KugouLite \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/KugouLite.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee build.log

      - name: Package unsigned IPA
        run: |
          APP=$(find build/KugouLite.xcarchive/Products/Applications -maxdepth 1 -name "*.app" | head -1)
          echo "app: $APP"
          test -n "$APP"
          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          cd out
          zip -qry ../KugouLite-iOS15-unsigned.ipa Payload
          cd ..
          ls -lh KugouLite-iOS15-unsigned.ipa

      - name: Summary
        if: always()
        run: |
          echo "=== errors ==="
          grep "error:" build.log | sort -u | head -100 || true
          echo "=== result ==="
          grep -E "ARCHIVE (SUCCEEDED|FAILED)" build.log | tail -2 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: unsigned-ipa
          path: KugouLite-iOS15-unsigned.ipa

      - name: Publish IPA to release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.158
          name: Sonora 1.0.158
          body: |
            Sonora 1.0.158 unsigned IPA

            对照 iOS 27 / iOS 27.2 Apple Music 补做主题与页面级修正。
            - 重新标定文字系统：次要文字从固定 #8E8E93 改为动态 system secondary，
              正文/说明由 10–12pt 统一提升到 13–14pt，解决小字在浅色纸面和封面渐变上看不清
            - 歌手页按 iOS 27 重做：整页头图环境色、大号字标式歌手名、信息/播放/收藏控制、
              分享+更多玻璃胶囊、最新发行、热门歌曲、代表专辑
            - 专辑页改为整页环境色深色表面，提升封面标题、曲目信息与列表文字对比度
            - 资料库索引行对齐 Apple Music：播放列表 / 歌手 / 专辑 / 歌曲 / 下载；
              上置 3×2 收藏专辑网格；新增可点开的歌手聚合页
            - 首页补充 Made for You 标识、Recently Played 标题与右侧 chevron
            - 播放页固定深色高对比界面，AirPlay/时间/歌词正文清晰度提升
            - 支持 iOS 27 横屏播放页：左封面、右歌曲信息/进度/控制/当前歌词；
              其他页面仍锁竖屏
            - 保持 2pt 进度条、透明断口球、歌词模糊、真实渐变磨砂顶栏
