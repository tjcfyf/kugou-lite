name: KugouLite
options:
  bundleIdPrefix: com.tjcfyf
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
schemes:
  KugouLite:
    build:
      targets:
        KugouLite: all
    run:
      config: Release
    archive:
      config: Release
targets:
  KugouLite:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources/mss-model.tflite
        buildPhase: resources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Sonora
        CFBundleShortVersionString: "1.0.100"
        CFBundleVersion: "100"
        UILaunchScreen: {}
        UIBackgroundModes:
          - audio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        CFBundleURLTypes:
          - CFBundleURLName: tencent205141
            CFBundleURLSchemes:
              - tencent205141
        LSApplicationQueriesSchemes:
          - mqq
          - mqqapi
          - mqqopensdkapiV3
          - mqqOpensdkSSoLogin
          - mqqbrowser
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tjcfyf.kugoulite
        PRODUCT_NAME: KugouLite
        TARGETED_DEVICE_FAMILY: "1,2"
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/Vendor"
        OTHER_LDFLAGS: "$(inherited) -framework TensorFlowLiteC -lc++ -framework SystemConfiguration -force_load $(SRCROOT)/Vendor/TencentOpenAPI.framework/TencentOpenAPI"
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Sonora-Bridging-Header.h
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
