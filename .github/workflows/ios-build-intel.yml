name: iOS Build Intel

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          if [ -d /Applications/Xcode_26.3.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.3.app
          else
            sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          fi
          xcodebuild -version
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi
          xcodegen --version

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Archive (unsigned)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project KugouLite.xcodeproj \
            -scheme KugouLite \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/KugouLite.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee build.log

      - name: Package unsigned IPA
        run: |
          APP=$(find build/KugouLite.xcarchive/Products/Applications -maxdepth 1 -name "*.app" | head -1)
          echo "app: $APP"
          test -n "$APP"
          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          cd out
          zip -qry ../KugouLite-iOS15-unsigned.ipa Payload
          cd ..
          ls -lh KugouLite-iOS15-unsigned.ipa

      - name: Summary
        if: always()
        run: |
          echo "=== errors ==="
          grep "error:" build.log | sort -u | head -100 || true
          echo "=== result ==="
          grep -E "ARCHIVE (SUCCEEDED|FAILED)" build.log | tail -2 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: unsigned-ipa
          path: KugouLite-iOS15-unsigned.ipa

      - name: Publish IPA to release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.135
          name: Sonora 1.0.135
          body: |
            Sonora 1.0.135 unsigned IPA
            - 评论区楼中楼回复
            - AI 分离改回最初 4.7MB MSS 4-stem 实时模型，播放中即时处理，不再离线等整首
            - 播放页下拉收起与手指 1:1 跟手，整页快照弹簧收尾
            - 全局动效换成 Apple Music 式弹簧，统一按压、tab、面板、列表过渡
            - 迷你播放器改成悬浮磨砂卡，底栏透出四周；封面阴影减重
            - 我的歌单：歌单按最新加入排最上面；歌单详情从最新加入的歌曲开始加载
            - 歌单/榜单详情滚到底部自动加载下一页，不再需要点“加载更多”
            - 歌单详情单页取 300 首，常见歌单一次加载完
            - 歌单滚动：封面缩略图预解码、去掉每行播放器订阅与原生 Menu，300 行明显更顺
            - 伴唱连续输出：MSS 先攒两块再出声、单次回调只跑一块模型、局部欠载保留原音
            - 播放页点歌词不再整页插值/逐行 blur，修复刚打开歌曲时点歌词卡死
            - 设置关闭伴唱后播放页同步隐藏「分离」按钮
            - 进度条改为波形，副歌区间用暖色标记，去掉圆形进度点
          files: KugouLite-iOS15-unsigned.ipa
