name: iOS Build Intel

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          if [ -d /Applications/Xcode_26.3.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.3.app
          else
            sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          fi
          xcodebuild -version
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi
          xcodegen --version

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Archive (unsigned)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project KugouLite.xcodeproj \
            -scheme KugouLite \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/KugouLite.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee build.log

      - name: Package unsigned IPA
        run: |
          APP=$(find build/KugouLite.xcarchive/Products/Applications -maxdepth 1 -name "*.app" | head -1)
          echo "app: $APP"
          test -n "$APP"
          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          cd out
          zip -qry ../KugouLite-iOS15-unsigned.ipa Payload
          cd ..
          ls -lh KugouLite-iOS15-unsigned.ipa

      - name: Summary
        if: always()
        run: |
          echo "=== errors ==="
          grep "error:" build.log | sort -u | head -100 || true
          echo "=== result ==="
          grep -E "ARCHIVE (SUCCEEDED|FAILED)" build.log | tail -2 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: unsigned-ipa
          path: KugouLite-iOS15-unsigned.ipa

      - name: Publish IPA to release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.144
          name: Sonora 1.0.144
          body: |
            Sonora 1.0.144 unsigned IPA
            - 播放进度条已播放段顶端加透明材质圆块，跟随进度逐帧移动；不改变 2pt 细线、不加粗、不换色
            - 圆块用 ultraThinMaterial + 极低透明度主色填充 + 0.5pt 描边，透明不遮挡轨道线
            - 歌词行点击 seek 也改为下一轮 runloop 执行，避免和进度条一样在手势事务里同步 seek
            - 保留 v143 的进度条卡死修复、v142 的歌词页封面不闪空与整体过渡优化
          files: KugouLite-iOS15-unsigned.ipa
